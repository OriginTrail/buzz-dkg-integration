# Phase 0 isolated Buzz stack — project `bdi-spike`.
# Images are built locally from the pinned block/buzz checkout (dd222a5).
# Postgres/Redis have NO host ports; only the relay is published, on 127.0.0.1:9440.
name: bdi-spike

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: bdi_spike_pg
      POSTGRES_DB: buzz
    volumes:
      - bdi-spike-pg:/var/lib/postgresql/data
    # Published on loopback for the host-process relay variant (see README);
    # 15442 is in the ISOLATION.md reserved-free set.
    ports:
      - "127.0.0.1:15442:5432"
    networks: [bdi-spike-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:15443:6379"
    networks: [bdi-spike-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: buzz_dev
      MINIO_ROOT_PASSWORD: bdi_spike_minio
    ports:
      - "127.0.0.1:15444:9000"
    volumes:
      - bdi-spike-minio:/data
    networks: [bdi-spike-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    networks: [bdi-spike-net]
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 buzz_dev bdi_spike_minio &&
        mc mb --ignore-existing local/buzz-media &&
        mc anonymous set none local/buzz-media
      "
    restart: "no"

  relay:
    image: buzz-relay:dd222a5
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://buzz:bdi_spike_pg@postgres:5432/buzz
      REDIS_URL: redis://redis:6379
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      # Throwaway key, generated for this spike only (see phase0/README.md).
      BUZZ_RELAY_PRIVATE_KEY: ${BDI_SPIKE_RELAY_KEY}
    ports:
      - "127.0.0.1:9440:3000"
    networks: [bdi-spike-net]

networks:
  bdi-spike-net:

volumes:
  bdi-spike-minio:
  bdi-spike-pg:
