name: Release installer bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: installer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a reviewed main-branch commit
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to commits already merged into main" >&2
            exit 1
          }

  validate:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm run verify:dkg-release
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  build:
    needs: [source, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Build and architecture-check release bundle
        run: ./scripts/build-release-bundle.sh linux ${{ matrix.arch }} "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release"
      - name: Attest release bundle provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/release/buzz-dkg-linux-${{ matrix.arch }}.tar.gz
      - name: Export offline attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          asset="buzz-dkg-linux-${{ matrix.arch }}.tar.gz"
          for attempt in 1 2 3 4 5; do
            if gh attestation download "$asset" --repo "$GITHUB_REPOSITORY"; then
              break
            fi
            [ "$attempt" -lt 5 ] || exit 1
            sleep 2
          done
          mapfile -t bundles < <(find . -maxdepth 1 -type f -name '*.jsonl' -print)
          [ "${#bundles[@]}" -eq 1 ] || {
            echo "Expected exactly one downloaded attestation bundle" >&2
            exit 1
          }
          mv "${bundles[0]}" "$asset.attestation.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: buzz-dkg-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    environment: installer-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: buzz-dkg-linux-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          install.sh
          "$RUNNER_TEMP"/release/*
          --repo "$GITHUB_REPOSITORY"
          --generate-notes
          --verify-tag
