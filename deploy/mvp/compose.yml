name: buzz-dkg-m0

# Local M0 Buzz dependencies only. DKG and the integration daemon are host
# processes so their lifecycle and token-file interfaces remain authoritative.
# Shared dependency details live in deploy/buzz/compose.common.yml.
services:
  postgres:
    extends:
      file: ../buzz/compose.common.yml
      service: postgres
    networks: [buzz]
    labels: &scope-label
      com.buzz-dkg.scope: m0

  redis:
    extends:
      file: ../buzz/compose.common.yml
      service: redis
    networks: [buzz]
    labels: *scope-label

  minio:
    extends:
      file: ../buzz/compose.common.yml
      service: minio
    networks: [buzz]
    labels: *scope-label

  minio-init:
    extends:
      file: ../buzz/compose.common.yml
      service: minio-init
    networks: [buzz]
    labels: *scope-label

  relay:
    extends:
      file: ../buzz/compose.common.yml
      service: relay
    environment:
      RELAY_URL: ws://127.0.0.1:9440
      BUZZ_RELAY_PRIVATE_KEY: ${BDI_SPIKE_RELAY_KEY:?missing BDI_SPIKE_RELAY_KEY}
    networks: [buzz]
    labels: *scope-label

volumes:
  postgres-data:
    name: buzz-dkg-m0-postgres
    labels: *scope-label
  redis-data:
    name: buzz-dkg-m0-redis
    labels: *scope-label
  minio-data:
    name: buzz-dkg-m0-minio
    labels: *scope-label
  git-data:
    name: buzz-dkg-m0-git
    labels: *scope-label

networks:
  buzz:
    name: buzz-dkg-m0-net
    driver: bridge
    labels: *scope-label
